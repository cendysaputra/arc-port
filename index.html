<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <meta name="description" content="Portfolio of Cendy Saputra. Situs WordPress dan Laravel bersama Imajiner.">
  <title>Cendy Saputra</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Crect width='16' height='16' fill='%23ffffff'/%3E%3Crect x='4' y='4' width='8' height='8' fill='%23090909'/%3E%3C/svg%3E">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400&amp;display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles/main.css">
</head>
<body>
  <a class="skip" href="#work">Skip to work</a>
  <header class="site-header" id="top">
    <div class="site-id">
      <h1 class="site-name" data-site-name>Cendy Saputra</h1>
      <a class="contact" data-contact href="mailto:ce.createe@gmail.com">Contact</a>
    </div>
    <p class="site-intro" data-site-intro>Web developer — situs WordPress &amp; Laravel bersama Imajiner.</p>
  </header>
  <main id="content">
    <section class="work" id="work" aria-labelledby="work-heading">
      <h2 id="work-heading" class="visually-hidden">Selected work</h2>
      <ul class="tag-list" data-tags aria-label="Filter projects by tag">
        <li><button type="button" class="tag" data-filter="all" aria-pressed="true">All</button></li>
        <li><button type="button" class="tag" data-filter="WordPress" aria-pressed="false">WordPress</button></li>
        <li><button type="button" class="tag" data-filter="Laravel" aria-pressed="false">Laravel</button></li>
      </ul>
      <p class="visually-hidden" data-filter-status aria-live="polite"></p>
      <p class="grid-note" data-empty hidden>No projects yet.</p>
      <noscript>
        <p class="grid-note">Projects are listed when JavaScript is available.</p>
      </noscript>
      <ul class="card-grid" data-grid aria-label="Projects"></ul>
    </section>
  </main>
  <footer class="site-footer">
    <a class="footer-mail" data-footer-mail href="mailto:ce.createe@gmail.com">ce.createe@gmail.com</a>
    <p class="footer-clock"><span class="visually-hidden">Jakarta time, </span><time data-jakarta-time>00:00:00</time> WIB</p>
  </footer>
  <script src="scripts/projects.js"></script>
  <script src="scripts/main.js"></script>
  <script src="scripts/cursor.js"></script>
</body>
</html>
